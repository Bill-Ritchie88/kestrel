name: Project Kestrel CI

# Runs on every push to main or a sprint branch, and on every pull request.

on:
  push:
    branches: [main, "sprint-*/**"]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a credential or .env is tracked
        run: python scripts/check_secrets.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check . --output-format=github

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      # No DATABASE_URL is configured, so tests marked `integration` skip
      # themselves. The unit suite must pass without any credentials.
      - run: pytest -v

  client:
    name: Web client (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # Flutter from its official repository, so the workflow needs no
      # third-party action (the repository only allows GitHub's own).
      - name: Install Flutter (stable)
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # On failure, the first lines of each failing test are also raised as
      # annotations, so they show on the run summary without opening the log.
      - name: flutter test
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            python3 ../scripts/ci_annotate_flutter.py test.log
            exit 1
          fi
      # Proves the web build compiles; the output is not published.
      - run: flutter build web --release
