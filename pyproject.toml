# Project Kestrel - package manifest and tool configuration.
#
# The application lives in src/kestrel and is installed in editable mode
# (pip install -e .), so `import kestrel` works from anywhere and a stray file
# at the repository root can never shadow a real module. Lint and test settings
# are declared once here so they are identical on the workstation and in CI.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel"
description = "Agentic passenger re-accommodation with a deterministic transaction layer"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { attr = "kestrel.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
# .claude holds third-party agent skills (e.g. ui-ux-pro-max), not Kestrel code.
exclude = ["__pycache__", ".venv", "venv", ".claude"]

[tool.ruff.lint]
# E/F  pyflakes + pycodestyle errors
# I    import ordering
# B    bugbear (mutable defaults, unused loop vars)
# S    bandit security rules - the .env incident is why this is on
# UP   pyupgrade
select = ["E", "F", "I", "B", "S", "UP", "W"]
ignore = [
    "E501",    # line length is handled by the formatter
    "S101",    # assert is expected in tests
    "B008",    # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]        # hardcoded test secrets are deliberate
"scripts/*" = ["S311"]              # random is for synthetic data, not crypto

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live DATABASE_URL; skipped when it is unset",
]
filterwarnings = ["error::DeprecationWarning"]
