# Google Cloud Build: the Kestrel image from deploy/Dockerfile, built from
# the local folder that `gcloud builds submit` uploads (deploy/README.md).
#
#   gcloud builds submit --region=europe-west3 --config=deploy/cloudbuild.yaml \
#     --substitutions=_IMAGE=europe-west3-docker.pkg.dev/PROJECT_ID/kestrel/kestrel:v1 .

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
